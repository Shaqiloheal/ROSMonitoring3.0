path: /home/shaqiloheal/ros2_ws/src/

nodes:
  - node:
      name: talker
      package: py_pubsub
      path: /home/shaqiloheal/ros2_ws/src/py_pubsub/run.launch
  - node:
      name: listener
      package: py_pubsub
      path: /home/shaqiloheal/ros2_ws/src/py_pubsub/run.launch
  - node:
      name: temperature_publisher
      package: temperature_sensor
      path: /home/shaqiloheal/ros2_ws/src/temperature_sensor/run.launch
  - node:
      name: minimal_service
      package: py_srvcli
      path: /home/shaqiloheal/ros2_ws/src/py_srvcli/run.launch
  - node:
      name: minimal_client_async
      package: py_srvcli
      path: /home/shaqiloheal/ros2_ws/src/py_srvcli/run.launch

monitors:
  - monitor:
      id: monitor_pubsub
      log: ./log_pubsub.txt
      silent: False
      topics:
        - name: chatter
          type: std_msgs.msg.String
          action: log
        - name: numbers
          type: std_msgs.msg.Int32
          action: log
        - name: status
          type: std_msgs.msg.Bool
          action: log

  - monitor:
      id: monitor_temperature
      log: ./log_temperature.txt
      silent: False
      topics:
        - name: temperature
          type: std_msgs.msg.Float32
          action: log

